name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore and verify immutable samples
        run: python tools/unpack_offline_samples.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Backend regression tests
        run: python -m pytest
      - name: Frontend regression tests
        run: npm test
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
      - name: Offline smoke test
        run: python tools/verify_handoff.py
